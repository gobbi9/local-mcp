[env]
MCP_LOG_LEVEL = "debug"
SUPERGATEWAY_CMD = "npx -y supergateway"
TIME_MCP_CMD = "uvx mcp-server-time --local-timezone=Europe/Berlin"
FETCH_MCP_CMD = "uvx mcp-server-fetch"
INSPECTOR_CMD = "npx @modelcontextprotocol/inspector"
GITHUB_PERSONAL_MCP_CMD = "sh -lc 'GITHUB_PERSONAL_ACCESS_TOKEN=op://Personal/gh-cli/token exec op run --account my.1password.eu -- github-mcp-server stdio'"
GITHUB_OPENSOCKETS_MCP_CMD = "sh -lc 'GITHUB_PERSONAL_ACCESS_TOKEN=op://Opensockets/gh-cli/token exec op run --account my.1password.eu -- github-mcp-server stdio'"

[tools]
caddy = "latest"
node = "lts"
uv = "latest"
"github:github/github-mcp-server" = "latest"

[discovery]
name = "local-mcp-gateway"
description = "Agent discovery document for local MCP endpoints"
baseUrl = "http://localhost:8765"

[discovery.protocol]
type = "mcp-streamable-http"
httpMethod = "POST"
acceptsGet = false

[discovery.protocol.requiredHeaders]
Content-Type = "application/json"
Accept = "application/json, text/event-stream"

[discovery.clientHints]
avoidEndpointProbing = true
callToolsListEarly = true
cacheToolsListPerSession = true

[discovery.clientHints.requestOrder]
steps = [
  "POST tools/list once per session",
  "POST tools/call"
]

[mcp.time]
description = "Use for current time and timezone conversion (e.g., Australia/Sydney, America/Sao_Paulo)."
type = "stdio"
supergatewayProxy = "streamableHttp"
run = "{{env.TIME_MCP_CMD}}"
port = 10001
path = "/time"

[mcp.fetch]
description = "Use for fetching and extracting data from webpages."
type = "stdio"
supergatewayProxy = "streamableHttp"
run = "{{env.FETCH_MCP_CMD}}"
port = 10002
path = "/fetch"

[mcp.inspector]
description = "Interactive MCP Inspector web UI for debugging servers and tools."
run = "{{env.INSPECTOR_CMD}}"
port = 6274
path = "/inspector"

[mcp.github-personal]
description = "Use for GitHub repository operations via MCP tools (issues, PRs, code, metadata) with personal account token."
type = "stdio"
supergatewayProxy = "streamableHttp"
run = "{{env.GITHUB_PERSONAL_MCP_CMD}}"
port = 10003
path = "/github-personal"

[mcp.github-opensockets]
description = "Use for GitHub repository operations via MCP tools (issues, PRs, code, metadata) with opensockets org token."
type = "stdio"
supergatewayProxy = "streamableHttp"
run = "{{env.GITHUB_OPENSOCKETS_MCP_CMD}}"
port = 10004
path = "/github-opensockets"
